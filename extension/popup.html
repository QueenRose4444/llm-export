<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LLM Export</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f1e1d; --muted: #6b6864; --line: #e5e1dc;
    --accent: #c96442; --accent-ink: #ffffff; --ok: #2f7d4f; --warn: #a4632a;
    --panel: #faf9f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #262624; --fg: #f2efe9; --muted: #a6a29b; --line: #3c3b38;
      --accent: #d97757; --accent-ink: #1f1e1d; --ok: #7fc79b; --warn: #e0a06a;
      --panel: #2f2e2b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 320px; padding: 14px;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg);
  }
  h1 { margin: 0 0 2px; font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 12px; }
  .sub b { color: var(--fg); font-weight: 600; }

  fieldset { border: 0; margin: 0 0 12px; padding: 0; display: grid; gap: 7px; }
  label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent); margin: 0; }

  button {
    width: 100%; padding: 9px 12px; border: 0; border-radius: 7px;
    background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  button.ghost {
    background: transparent; color: var(--fg);
    box-shadow: inset 0 0 0 1px var(--line); margin-top: 7px; font-weight: 500;
  }

  #status { margin-top: 11px; font-size: 12px; color: var(--muted); min-height: 16px; }
  #result {
    margin-top: 10px; padding: 9px 10px; border-radius: 7px;
    background: var(--panel); box-shadow: inset 0 0 0 1px var(--line);
    font-size: 12px; display: none;
  }
  #result.show { display: block; }
  #result dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  #result dt { color: var(--muted); }
  #result dd { margin: 0; }
  .warn { color: var(--warn); margin-top: 8px; line-height: 1.4; }
  .err  { color: var(--accent); margin-top: 8px; }
  .ok   { color: var(--ok); }
  footer { margin-top: 12px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <h1>LLM Export</h1>
  <div class="sub" id="site">Checking this tab…</div>

  <fieldset>
    <label><input type="checkbox" id="opt-md"     checked> Markdown transcript (.md)</label>
    <label><input type="checkbox" id="opt-json"   checked> Structured data (.json)</label>
    <label><input type="checkbox" id="opt-expand" checked> Open thinking &amp; tool blocks</label>
    <label><input type="checkbox" id="opt-name"> Ask me for a file name</label>
    <label><input type="checkbox" id="opt-dev"> Developer mode — allow page captures</label>
  </fieldset>

  <button id="run">Export this chat</button>
  <button id="copy" class="ghost" hidden>Copy Markdown</button>
  <button id="capture" class="ghost" hidden>Capture this page</button>

  <div id="status"></div>
  <div id="result"></div>

  <footer>
    Saves to your Downloads folder, in <b>llm-export/</b>.
    <span id="ver"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
